# Entorno exclusivo de verificación: no usa .env, puertos o volúmenes de la demo.
services:
  db:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_USER: pln_test
      POSTGRES_PASSWORD: local-test-only-123456789
      POSTGRES_DB: pln_test
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pln_test -d pln_test"]
      interval: 2s
      timeout: 3s
      retries: 30
