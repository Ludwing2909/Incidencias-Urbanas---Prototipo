server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 32k;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    access_log off;
  }
  location / { try_files $uri $uri/ /index.html; }
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'";
}
